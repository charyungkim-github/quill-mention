<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quill Mention - Korean IME Test</title>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
      }
      #editor {
        height: 300px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      h1 {
        color: #333;
        font-size: 24px;
        margin-bottom: 10px;
      }
      .instructions {
        background-color: #f0f8ff;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 20px;
        border-left: 4px solid #0066cc;
      }
      .instructions h2 {
        font-size: 16px;
        margin-top: 0;
        color: #0066cc;
      }
      .instructions ul {
        margin: 10px 0;
        padding-left: 20px;
      }
      .instructions li {
        margin: 5px 0;
      }
      .test-status {
        background-color: #fff3cd;
        padding: 10px 15px;
        border-radius: 4px;
        margin-bottom: 20px;
        border-left: 4px solid #ffc107;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Quill Mention - 한글 IME 입력 테스트</h1>

    <div class="test-status">✅ 한글 실시간 검색 기능이 활성화되었습니다</div>

    <div class="instructions">
      <h2>📋 테스트 방법</h2>
      <ul>
        <li><strong>기대 결과:</strong> "@가" 입력 시 즉시 "가"로 검색된 멘션 리스트가 나타나야 합니다</li>
        <li><strong>테스트 1:</strong> "@" 입력 후 "가" 입력 → 김철수, 김영희, 박가영이 즉시 표시</li>
        <li><strong>테스트 2:</strong> "@" 입력 후 "나" 입력 → 최나연이 즉시 표시</li>
        <li><strong>테스트 3:</strong> "@" 입력 후 "이" 입력 → 이민준, 이서연이 즉시 표시</li>
        <li><strong>테스트 4:</strong> "@" 입력 후 "김" 입력 → 김철수, 김영희가 즉시 표시</li>
      </ul>
    </div>

    <div id="editor"></div>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script src="./dist/quill.mention.js"></script>
    <link href="./dist/quill.mention.css" rel="stylesheet" />

    <script>
      // 한글 + 영문 이름 데이터
      const koreanNames = [
        { id: "1", value: "김철수" },
        { id: "2", value: "김영희" },
        { id: "3", value: "이민준" },
        { id: "4", value: "이서연" },
        { id: "5", value: "박지훈" },
        { id: "6", value: "박가영" },
        { id: "7", value: "정다은" },
        { id: "8", value: "정수민" },
        { id: "9", value: "최나연" },
        { id: "10", value: "최동욱" },
        { id: "11", value: "John Doe" },
        { id: "12", value: "Jane Smith" },
        { id: "13", value: "Bob Johnson" },
        { id: "14", value: "Alice Williams" },
      ]

      const quill = new Quill("#editor", {
        theme: "snow",
        placeholder: "@를 입력하여 멘션을 시작하세요...",
        modules: {
          mention: {
            allowedChars: /^[a-zA-Z0-9가-힣\s]*$/,
            mentionDenotationChars: ["@"],
            source: function (searchTerm, renderList, mentionChar) {
              console.log("🔍 검색어:", searchTerm) // 디버깅용

              if (searchTerm.length === 0) {
                console.log("📋 전체 리스트 표시")
                renderList(koreanNames, searchTerm)
              } else {
                const matches = []
                for (let i = 0; i < koreanNames.length; i++) {
                  if (koreanNames[i].value.includes(searchTerm)) {
                    matches.push(koreanNames[i])
                  }
                }
                console.log(
                  "✅ 검색 결과:",
                  matches.length + "개",
                  matches.map((m) => m.value)
                ) // 디버깅용
                renderList(matches, searchTerm)
              }
            },
            renderItem: function (item, searchTerm) {
              // 검색어 하이라이트 - HTMLElement 반환
              const span = document.createElement("span")
              if (searchTerm) {
                const value = item.value
                const index = value.indexOf(searchTerm)
                if (index >= 0) {
                  const before = value.substring(0, index)
                  const match = value.substring(index, index + searchTerm.length)
                  const after = value.substring(index + searchTerm.length)

                  span.appendChild(document.createTextNode(before))
                  const strong = document.createElement("strong")
                  strong.style.backgroundColor = "#ffeb3b"
                  strong.textContent = match
                  span.appendChild(strong)
                  span.appendChild(document.createTextNode(after))

                  return span
                }
              }
              span.textContent = item.value
              return span
            },
          },
        },
      })

      console.log("✅ Quill 에디터 초기화 완료")
      console.log("🎯 한글 IME 입력 테스트를 시작하세요!")
      console.log("💡 브라우저 콘솔에서 검색 과정을 실시간으로 확인할 수 있습니다.")
    </script>
  </body>
</html>
